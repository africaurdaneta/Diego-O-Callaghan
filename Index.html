<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innova - Sistema de Gestión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <h2>Innova</h2>
            </div>
            <nav class="menu">
                <a href="#" class="active">📊 Dashboard</a>
                <a href="#">📦 Inventario</a>
                <a href="#">🛒 Pedidos</a>
                <a href="#">🧾 Facturación</a>
                <a href="#">⚙️ Configuración</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h1>Panel de Control</h1>
                <div class="user-profile">
                    <span>Diego O'Callaghan</span>
                </div>
            </header>

            <section class="metrics">
                <div class="card">
                    <h3>Ventas del Día</h3>
                    <p class="value">$1,240.00</p>
                </div>
                <div class="card">
                    <h3>Pedidos Pendientes</h3>
                    <p class="value">12</p>
                </div>
                <div class="card">
                    <h3>Productos Alerta Stock</h3>
                    <p class="value">4</p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
